# El puerto lo define Render con la variable PORT; en tu computador sigue siendo 8081
server.port=${PORT:8081}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
spring.application.name=barberbook

# Base de datos: en Render se sobreescribe con SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barberbook}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# Local: create-drop. Render: SPRING_JPA_HIBERNATE_DDL_AUTO=update
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
# Render: tras el primer despliegue (que carga data.sql) se pone SPRING_SQL_INIT_MODE=never
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Frontend: URL a la que Wompi devuelve al usuario y orígenes permitidos por CORS (separados por coma)
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.cors-origins=${CORS_ORIGINS:${FRONTEND_URL:http://localhost:4200}}

# Wompi (modo pruebas). Las llaves se guardan en variables de entorno, nunca en GitHub
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.integrity-key=${WOMPI_INTEGRITY_KEY:}
wompi.events-secret=${WOMPI_EVENTS_SECRET:}
